<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escuela de Magia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Escuela de Magia</div>
    <div id="status" class="status"></div>
    <button id="rulesBtn" class="btn ghost small">Reglas</button>
    <button id="logBtn" class="btn ghost small hidden">Crónica</button>
    <span id="roomInfo" class="room-info"></span>
  </header>

  <main id="home" class="home hidden">
    <div class="home-card">
      <div class="home-title">
        <h1>Escuela de Magia</h1>
        <p class="subtitle">El bosque de los druidas</p>
      </div>
      <input id="nameInput" class="input" maxlength="20" placeholder="Tu nombre" aria-label="Tu nombre">
      <div class="home-actions">
        <button id="createBtn" class="btn primary">Crear partida</button>
        <div class="join-row">
          <input id="codeInput" class="input code" maxlength="4" placeholder="CÓDIGO" aria-label="Código de sala">
          <button id="joinBtn" class="btn">Entrar</button>
        </div>
      </div>
      <p id="homeError" class="error"></p>
    </div>
  </main>

  <main id="app" class="hidden">
    <section id="lobby" class="hidden"></section>
    <section id="table" class="table hidden">
      <div id="prompt" class="prompt"></div>
      <div class="board">
        <section class="center">
          <div id="claro" class="panel claro-panel"></div>
          <div id="catalog" class="panel catalog-panel"></div>
        </section>
        <section id="mine" class="panel mine"></section>
        <aside id="rivals" class="rivals"></aside>
      </div>
    </section>
  </main>

  <aside id="journal" class="journal hidden">
    <div class="journal-head"><h3>Crónica</h3><button class="btn tiny" data-a="closeLog">✕</button></div>
    <div id="log" class="log"></div>
    <form id="chatForm" class="chat-row">
      <input id="chatInput" class="input" maxlength="200" placeholder="Escribe al grupo…" autocomplete="off">
      <button class="btn small">Enviar</button>
    </form>
  </aside>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
