  /* Se diseña a 1280×720 y se escala para llenar la pantalla (zoom calculado al cargar) */
  body { width: 1280px; height: 720px; background: transparent; color: var(--tinta); user-select: none;
    font: 14px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 22px 40px 26px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; }
  .ico { width: 18px; height: 18px; }

  /* Cabecera */
  .barra { width: 100%; display: grid; grid-template-columns: 256px 1fr 256px; column-gap: 24px; align-items: center; }
  .lado { display: flex; gap: 22px; }
  .lado.der { justify-content: space-between; gap: 0; }
  .lado.der .jug { gap: 5px; }
  .centro { text-align: center; }
  .logo { font-weight: 700; letter-spacing: .4em; font-size: 15px; padding-left: .4em; }
  .era { color: var(--suave); font-size: 12px; margin-top: 3px; }
  .era b { color: var(--tinta); font-weight: 600; }
  .jug { display: flex; align-items: center; gap: 7px; color: var(--suave); border-radius: 14px; padding: 2px 6px; margin: -2px -6px; }
  .jug.activo { color: var(--tinta); font-weight: 700; background: #fff; box-shadow: 0 0 0 1.5px var(--tinta); }
  .sello { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; }
  .registro-btn { color: var(--suave); font-size: 11px; text-decoration: underline; cursor: pointer; margin-left: 6px; }

  /* Guía: mensajes flotantes que explican el siguiente paso */
  body { position: relative; }
  #guia { position: absolute; z-index: 80; width: 270px; background: var(--mana); color: #fff; border-radius: 14px; padding: 11px 14px 10px;
    font-size: 12.5px; line-height: 1.45; box-shadow: 0 10px 28px rgba(76, 29, 149, .28); animation: aparece .25s ease-out; }
  #guia[hidden] { display: none; }
  #guia b { font-weight: 700; }
  #guia .apagar { display: block; margin-top: 6px; font-size: 10.5px; opacity: .8; text-decoration: underline; cursor: pointer; }
  #guia::after { content: ''; position: absolute; border: 8px solid transparent; }
  #guia.abajo::after { bottom: 100%; left: 50%; margin-left: -8px; border-bottom-color: var(--mana); } /* el mensaje está debajo de lo que señala */
  #guia.arriba::after { top: 100%; left: 50%; margin-left: -8px; border-top-color: var(--mana); }
  #guia.der::after { right: 100%; top: 50%; margin-top: -8px; border-right-color: var(--mana); }
  #guia.izq::after { left: 100%; top: 50%; margin-top: -8px; border-left-color: var(--mana); }
  @keyframes aparece { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { #guia, .aviso { animation: none; } }

  .juego { width: 100%; flex: 1; display: grid; grid-template-columns: 256px 1fr 256px; gap: 24px; margin-top: 18px; min-height: 0; }
  .titulo { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--suave); padding-left: .16em; text-align: center; }
  .panel { background: rgba(255, 252, 247, .78); border-radius: 18px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }

  /* Umbral */
  #umbral { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .fila-u { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; position: relative; cursor: pointer; flex: 1; }
  .fila-u .ilus { width: 76px; height: 76px; border-radius: 16px; }
  .fila-u .ilus svg { width: 36px; height: 36px; }
  .fila-u .nombre { text-align: left; margin-bottom: 4px; font-size: 13px; }
  .fila-u .esferas { justify-content: start; }
  .fila-u.cara > :not(.pista) { opacity: .38; }
  .linea { height: 1px; background: var(--linea); }

  /* Centro */
  .principal { display: flex; flex-direction: column; align-items: center; padding: 16px 0 18px; min-width: 0; }
  .principal > .titulo { margin-bottom: 22px; }
  #mano { display: flex; justify-content: center; align-items: flex-end; gap: var(--hueco, 20px); }
  .carta { width: var(--ancho, 108px); display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; cursor: pointer; }
  .carta .ilus { width: var(--ancho, 108px); height: 156px; border-radius: 18px; }
  .carta .ilus svg { width: 50px; height: 50px; }
  .carta .nombre { font-size: 12px; line-height: 1.2; text-align: center; height: 2.4em; display: flex; align-items: center; justify-content: center; } /* nombres largos: hasta 2 líneas, esferas alineadas */
  .carta.accion { transform: translateY(-6px); }
  .carta.accion .ilus { box-shadow: 0 0 0 3px var(--tinta); }
  .carta.usada .ilus { box-shadow: 0 0 0 3px var(--mana); }
  .etq { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; height: 12px; padding-left: .14em; }
  .etq.a { color: var(--tinta); } .etq.m { color: var(--mana); } .etq.n { color: var(--verde); }
  .carta.nueva .ilus { box-shadow: 0 0 0 3px var(--verde); animation: llega .5s ease-out; }
  @keyframes llega { from { transform: translateY(-14px); opacity: 0; } }
  .pila { cursor: pointer; }
  .vacia { color: var(--suave); font-size: 12px; height: 220px; display: flex; align-items: center; }

  .arriba { display: grid; grid-template-columns: 108px 1fr 108px; align-items: center; justify-items: center; width: 364px; margin-top: auto; }
  .pila { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--suave); font-size: 13px; }

    j.desc.push(c);
    this.nota('descarta', c);
  }

  elegirManoEncima(i, idx) {
    const j = this.jug[i];
    const [c] = j.mano.splice(idx, 1);
    j.mazo.push(c);
    this.nota('encima', c);
  }

  elegirDescarteEncima(i, idx) {
    const j = this.jug[i];
    const [c] = j.desc.splice(idx, 1);
    j.mazo.push(c);
    this.nota('encima', c);
  }

  elegirRecuperar(i, idx) {
    const j = this.jug[i];
    const [c] = j.desc.splice(idx, 1);
    j.mano.push(c);
    this.nota('recupera', c);
    return c;
  }

  elegirCambioUmbral(u) {
    const [c] = this.umbral.splice(u, 1);
    this.reponer();
    return c;
  }


  // Valor de vincular lo mejor posible con 'mana' (para el bot).
  compra(i, mana) {
    const turnosMios = Math.max(0, Math.ceil(this.turnosPartida / this.n) - 1);
    const coef = 0.07 * turnosMios;
    const j = this.jug[i];
    // Liberar: el bot le da un valor proporcional a los turnos que le quedan.
    const k = Array.isArray(this.v.botLiberar) ? this.v.botLiberar[i] : this.v.botLiberar;
    const puedeLiberar = this.v.liberar && (j.jugadas.some((c) => c.inicial) || j.mano.some((c) => c.inicial));
    const valLib = k * turnosMios;
    let best = { idx: -1, val: 0, liberar: false };
    const probar = (idx, val, coste) => {
      if (coste > mana) return;
      if (val > best.val) best = { idx, val, liberar: false };
      if (puedeLiberar && valLib > 0 && (idx < 0 || !this.v.liberarEnLugar) && coste + this.v.liberarCoste <= mana && val + valLib > best.val) best = { idx, val: val + valLib, liberar: true };
    };
    probar(-1, 0, 0);
    this.umbral.forEach((c, idx) => probar(idx, coef * (fuerza(c, this.v) + (c.el === j.gusto ? 0.4 : 0)), this.coste(i, c)));
    return best;
  }

  // Mejor siguiente Acción mirando hasta 'prof' Acciones por delante (k = -1: dejar de jugar Acciones).
  plan(i, quedan, prof) {
    const j = this.jug[i];
    const base = this.valor(i);
    let best = { k: -1, val: this.compra(i, j.mano.reduce((a, c) => a + c.mana, 0)).val };
    if (quedan <= 0 || prof <= 0) return best;
    j.mano.forEach((c, k) => {
      if (!c.accion.length) return;
      const cl = this.clonar();
      cl.turnosPartida = this.turnosPartida;
      cl.jugarAccion(i, k);
      const val = cl.valor(i) - base + cl.plan(i, quedan - 1, prof - 1).val;
      if (val > best.val + 1e-9) best = { k, val };
    });
    return best;
  }

  turnoBot(i) {
    const j = this.jug[i];
    if (this.v.proteccion === 'turno') for (const s of ELEMENTOS) this.pres[s][i].prot = 0;
    const manaDe = (cs) => cs.reduce((a, c) => a + c.mana, 0);
    let usadas = 0;
    while (usadas < this.v.acciones) {
      const { k } = this.plan(i, this.v.acciones - usadas, 2);
      if (k < 0) break;
      this.jugarAccion(i, k);
      usadas++;
    }
    this.st.accionesTurno += usadas;
    const mana = manaDe(j.mano);
    for (const c of j.mano) this.st.usoMana[c.nombre] = (this.st.usoMana[c.nombre] || 0) + 1;
    this.st.manaGen += mana;
    let gastado = 0;
    for (let b = 0; b < this.v.compras; b++) {
      const { idx, liberar } = this.compra(i, mana - gastado);
      if (idx >= 0) {
        const c = this.umbral.splice(idx, 1)[0];
        gastado += this.coste(i, c);
        j.desc.push(c);
        j.vinculadas++;
        this.anotar({ i, tipo: 'vincula', carta: c.nombre });
        this.st.vinculadas[c.nombre] = (this.st.vinculadas[c.nombre] || 0) + 1;
        this.st.compras++;
        this.reponer();
      }
      if (liberar) {
        // devuelve a la caja cartas iniciales usadas este turno (primero las Motas de Maná)
        for (let t = 0; t < this.v.liberarMax; t++) {
          const usadas = [...j.jugadas.map((c, k) => ['jugadas', k, c]), ...j.mano.map((c, k) => ['mano', k, c])].filter((x) => x[2].inicial);
          if (!usadas.length) break;
          usadas.sort((a, b) => a[2].accion.length - b[2].accion.length);
          const [donde, k] = usadas[0];
          const [lib] = j[donde].splice(k, 1);
          j.liberadas++;
          this.anotar({ i, tipo: 'libera', carta: lib.nombre });
          this.st.liberadas++;
        }
        gastado += this.v.liberarCoste;
      }
      if (idx < 0) break;
    }
    this.st.manaGastado += gastado;
    this.st.desperdicio[this.era] += mana - gastado;
    this.st.turnosEra[this.era]++;
    this.st.turnos++;
    this.anotar({ i, tipo: 'fin', comoMana: j.mano.map((c) => c.nombre), sinUsar: [] });
    j.desc.push(...j.jugadas, ...j.mano);
    j.jugadas = [];
    j.mano = [];
    this.robar(j, this.v.mano);
  }

  puntuar() {
    const val = this.v.eras[this.era];
    const gan = this.jug.map(() => 0);
    this.ultimaPuntuacion = [];
    (this.historial = this.historial || []).push(this.ultimaPuntuacion);
    for (const s of ELEMENTOS) {
      const ns = this.pres[s].map((p) => p.n);
      const detalle = { s, val, presencia: ns.slice(), ganador: null, empate: false };
      this.ultimaPuntuacion.push(detalle);
      const orden = [...new Set(ns)].sort((a, b) => b - a);
      const top = orden[0];
      this.st.puntuaciones++;
      if (top === 0) {
        this.st.vacios++;
        continue;
      }
      let primeros = ns.map((x, k) => (x === top ? k : -1)).filter((k) => k >= 0);
      // afinidad 'empate': en su Santuario, el Guardián de ese color gana los empates
      if (primeros.length > 1 && this.v.afinidad && this.v.afinidad.includes('empate')) {
        const dueño = primeros.find((k) => this.jug[k].color === s);
        if (dueño !== undefined) primeros = [dueño];
      }
      if (primeros.length > 1) {
        detalle.empate = true;
        this.st.empates++;
        if (this.v.empate === 'reparto') primeros.forEach((k) => (gan[k] += Math.max(0, val - 1)));
        continue;
      }
      gan[primeros[0]] += val;
      detalle.ganador = primeros[0];
      if (this.jug[primeros[0]].color === s) this.st.propio = (this.st.propio || 0) + 1;
      if (this.v.segundo && orden[1] > 0) {
        const seg = ns.map((x, k) => (x === orden[1] ? k : -1)).filter((k) => k >= 0);
        if (seg.length === 1) gan[seg[0]] += Math.floor(val * this.v.segundo);
      }
    }
    this.jug.forEach((j, k) => {
      j.sellos += gan[k];
      j.selloEra.push(gan[k]);
    });
  }

  // --- Control de turnos paso a paso -------------------------------------------------
  iniciar() {
    const N = this.n;
    this.turnosPartida = N * this.v.rondas * this.v.eras.length;
    this.era = 0;
    this.ronda = 0; // rondas jugadas en toda la partida
    this.rondaEra = 0; // rondas jugadas en la Era actual
    this.t = 0; // turno dentro de la ronda
    this.inicioEra = 0; // en la Era I se sortea: el asiento 0 hace de jugador sorteado
    this.restantes = N * this.v.rondas;
    this.fin = false;
    this.ultimo = -1;
    return this;
  }

  jugadorActual() {
    const ini = this.v.rotacion === 'ronda' ? this.ronda % this.n : this.inicioEra;
    return (ini + this.t) % this.n;
  }

  comenzarTurno() {
    const i = this.jugadorActual();
    this.restantes--;
    this.turno = { i, manaUsadas: [], gastado: 0, vinculado: false, liberado: false };
    if (this.v.proteccion === 'turno') for (const s of ELEMENTOS) this.pres[s][i].prot = 0;
    return i;
  }

  terminarTurno() {
    this.turnosPartida--;
    this.ultimo = this.turno.i;
    this.t++;
    if (this.t < this.n) return;
    this.t = 0;
    this.ronda++;
    this.rondaEra++;
    if (this.rondaEra === this.v.rondas) this.finEra();
  }

  finEra() {
    const N = this.n;
    this.st.ultimoEra.push(this.ultimo);
    this.puntuar();
    this.limpiar();
    this.umbral = [];
    this.reponer();
    this.era++;
    this.rondaEra = 0;
    this.restantes = N * this.v.rondas;
    if (this.era === this.v.eras.length) {
      this.era--; // para que la última Era siga siendo la III al mostrarla
      const max = Math.max(...this.jug.map((j) => j.sellos));
      let gan = this.jug.filter((j) => j.sellos === max);
      if (gan.length > 1 && this.v.desempate === 'eraIII') {
        const m3 = Math.max(...gan.map((j) => j.selloEra[2]));
        gan = gan.filter((j) => j.selloEra[2] === m3);
      }
      this.ganadores = gan.map((j) => j.i);
      this.fin = true;
      return;
    }
    if (this.v.rotacion === 'era') {
      // empieza el que va primero en Sellos (así no tiene la última palabra);
      // si hay empate, el primero en sentido horario desde quien empezó la Era anterior
      const max = Math.max(...this.jug.map((j) => j.sellos));
      for (let d = 0; d < N; d++) {
        const k = (this.inicioEra + d) % N;
        if (this.jug[k].sellos === max) {
          this.inicioEra = k;
          break;
        }
      }
    }
  }

  jugar() {
    this.iniciar();
    while (!this.fin) {
      const i = this.comenzarTurno();
      this.turnoBot(i);
      this.terminarTurno();
    }
    return this;
  }

  // --- Turno de una persona ---------------------------------------------------------------
  manaDisponible() {
    return this.turno.manaUsadas.reduce((a, c) => a + c.mana, 0) - this.turno.gastado;
  }

  // Juega una carta de la mano como Acción (los objetivos se eligen a favor del jugador)
  humanoAccion(idx) {
    this.jugarAccion(this.turno.i, idx);
  }

  humanoMana(idx) {
    const j = this.jug[this.turno.i];
    this.turno.manaUsadas.push(j.mano.splice(idx, 1)[0]);
  }

  // Devuelve a la mano una carta usada como Maná, si ese Maná no se ha gastado
  humanoDevolver(k) {
    const c = this.turno.manaUsadas[k];
    if (!c || this.manaDisponible() < c.mana) return false;
    this.jug[this.turno.i].mano.push(...this.turno.manaUsadas.splice(k, 1));
    return true;
  }

  puedeVincular(u) {
    const c = this.umbral[u];
    return !!c && !this.turno.vinculado && this.coste(this.turno.i, c) <= this.manaDisponible();
  }

  humanoVincular(u) {
    if (!this.puedeVincular(u)) return false;
    const i = this.turno.i;
    const c = this.umbral.splice(u, 1)[0];
    this.turno.gastado += this.coste(i, c);
    this.turno.vinculado = true;
    this.jug[i].desc.push(c);
    this.jug[i].vinculadas++;
    this.anotar({ i, tipo: 'vincula', carta: c.nombre });
    this.reponer();
    return true;
  }

  // Liberar: devolver a la caja una carta inicial jugada este turno (donde: 'jugadas' o 'mana')
  puedeLiberar() {
    return this.v.liberar && !this.turno.liberado && this.manaDisponible() >= this.v.liberarCoste;
  }

  humanoLiberar(donde, k) {
    const j = this.jug[this.turno.i];
    const lista = donde === 'mana' ? this.turno.manaUsadas : j.jugadas;
    const c = lista[k];
    if (!c || !c.inicial || !this.puedeLiberar()) return false;
    // si se libera una carta usada como Maná, su Maná sigue contando: pagas con el resto
    lista.splice(k, 1);
    if (donde === 'mana') this.turno.gastado -= c.mana;
    this.turno.gastado += this.v.liberarCoste;
    this.turno.liberado = true;
    j.liberadas++;
    this.anotar({ i: this.turno.i, tipo: 'libera', carta: c.nombre });
    return true;
  }

  // --- Deshacer dentro del turno de una persona ---------------------------------------------
  // Copia de todo lo que puede cambiar durante un turno (sin robar ni barajar: eso no se deshace)
  guardarEstado() {
    const copia = (cs) => cs.slice();
    return {
      jug: this.jug.map((j) => ({ ...j, mazo: copia(j.mazo), mano: copia(j.mano), desc: copia(j.desc), jugadas: copia(j.jugadas), selloEra: copia(j.selloEra) })),
      pres: this.foto(),
      umbral: copia(this.umbral),
      pila: copia(this.pila),
      turno: { ...this.turno, manaUsadas: copia(this.turno.manaUsadas) },
      registro: this.registro ? this.registro.length : 0,
      extra: copia(this.extra),
    };
  }

  restaurarEstado(e) {
    this.jug = e.jug.map((j) => ({ ...j, mazo: j.mazo.slice(), mano: j.mano.slice(), desc: j.desc.slice(), jugadas: j.jugadas.slice(), selloEra: j.selloEra.slice() }));
    for (const s of ELEMENTOS) this.pres[s] = e.pres[s].map((x) => ({ ...x }));
    this.umbral = e.umbral.slice();
    this.pila = e.pila.slice();
    this.turno = { ...e.turno, manaUsadas: e.turno.manaUsadas.slice() };
    if (this.registro) this.registro.length = e.registro;
    this.extra = e.extra.slice();
  }

  humanoTerminar() {
    const j = this.jug[this.turno.i];
    this.anotar({ i: this.turno.i, tipo: 'fin', comoMana: this.turno.manaUsadas.map((c) => c.nombre), sinUsar: j.mano.map((c) => c.nombre),
      manaSobrante: this.manaDisponible() });
    j.desc.push(...j.jugadas, ...this.turno.manaUsadas, ...j.mano);
    j.jugadas = [];
    j.mano = [];
    this.turno.manaUsadas = [];
    this.robar(j, this.v.mano);
    this.st.turnos++;
    this.terminarTurno();
  }

}

module.exports = { Partida, BASE, V01, fuerza, rngFrom };

const ilus = (c) => c.el && IMAGENES[c.nombre]
  ? `<div class="ilus tx tx-${c.el} con-img"><img src="${IMAGENES[c.nombre]}" alt=""></div>`
  : c.el
  ? `<div class="ilus tx tx-${c.el}"><svg style="color:var(--${c.el})"><use href="#${c.el}"/></svg></div>`
  : '<div class="ilus" style="background:#ede9fe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="var(--mana)"/></svg></div>';
const pista = (c, coste) => `<div class="pista"><b>${c.nombre}</b>${textoDe(c)}<small>${c.inicial ? 'Carta inicial · ' : `Coste ${coste} · `}Como Maná: ${c.mana}</small></div>`;

// ---------- Dibujo de la mesa ----------------------------------------------------------------
function jugador(j) {
  const activo = !p.fin && p.turno && p.turno.i === j.i;
  return `<span class="jug ${activo ? 'activo' : ''}"><svg class="ico" style="color:var(--${j.color})"><use href="#${j.color}"/></svg>${NOMBRES[j.i]}<span class="sello">${j.sellos}</span></span>`;
}

function pintar() {
  const yo = p.jug[0];
  $('yo').innerHTML = jugador(yo) + '<span class="registro-btn" id="ver-registro">Registro</span>'
    + `<span class="registro-btn" id="ayuda">Ayuda: ${ayuda ? 'sí' : 'no'}</span>`;
  $('ver-registro').onclick = verRegistro;
  $('ayuda').onclick = () => { ponerAyuda(!ayuda); pintar(); };
  $('rivales').innerHTML = p.jug.slice(1).map(jugador).join('');
  $('rivales').style.justifyContent = p.n === 2 ? 'flex-end' : 'space-between';
  const quien = p.turno && !entreEras ? (p.turno.i === 0 ? '<b>Tu turno</b>' : `Turno de <b>${NOMBRES[p.turno.i]}</b>`) : '';
  $('era').innerHTML = p.fin ? '<b>Partida terminada</b>' : `<b>Era ${ROMANO[p.era]}</b> · Ronda ${Math.min(p.rondaEra + 1, p.v.rondas)} de ${p.v.rondas} · <b>${p.v.eras[p.era]} Sellos</b> por Santuario · ${quien}`;

  // Umbral
  const miTurno = esMiTurno();
  $('umbral').innerHTML = p.umbral.map((c, k) => {
    const coste = p.coste(0, c);
    const cara = !miTurno || !p.puedeVincular(k);
    return `<div class="fila-u ${cara ? 'cara' : ''}" data-u="${k}">${ilus(c)}<div><div class="nombre">${c.nombre}</div>${esferas(c, coste)}</div>${pista(c, coste)}</div>`;
  }).join('<div class="linea"></div>');

  // Mano: jugadas como Acción, usadas como Maná y el resto
  const cartas = [];
  if (miTurno) {
    yo.jugadas.forEach((c, k) => cartas.push({ c, donde: 'jugadas', k, etq: 'Acción' }));
    p.turno.manaUsadas.forEach((c, k) => cartas.push({ c, donde: 'mana', k, etq: 'Maná' }));
  }
  const porMarcar = nuevas.slice();
  yo.mano.forEach((c, k) => {
    const m = porMarcar.indexOf(c);
    if (m >= 0) porMarcar.splice(m, 1);
    cartas.push({ c, donde: 'mano', k, etq: m >= 0 ? 'Nueva' : '' });
  });
  const n = cartas.length;
  const ancho = n <= 5 ? 108 : Math.max(70, Math.floor((640 - (n - 1) * 10) / n));
  $('mano').style.setProperty('--ancho', ancho + 'px');
  $('mano').style.setProperty('--hueco', (n <= 5 ? 20 : 10) + 'px');
  $('mano').innerHTML = n ? cartas.map(({ c, donde, k, etq }) =>
    `<div class="carta ${etq === 'Acción' ? 'accion' : etq === 'Maná' ? 'usada' : etq === 'Nueva' ? 'nueva' : ''}" data-donde="${donde}" data-k="${k}">
      <div class="etq ${etq === 'Acción' ? 'a' : etq === 'Nueva' ? 'n' : 'm'}">${etq}</div>${ilus(c)}<div class="nombre">${c.nombre}</div>${esferas(c, c.coste)}${pista(c, c.coste)}</div>`).join('')
    : '<div class="vacia">Sin cartas en la mano</div>';

  $('mazo').textContent = yo.mazo.length;
  $('descarte').textContent = yo.desc.length;
  $('total').firstChild.textContent = miTurno ? p.manaDisponible() : 0;
  $('terminar').className = 'boton verde' + (miTurno ? '' : ' inactivo');
  $('deshacer').className = 'boton borde' + (miTurno && pasos.length ? '' : ' inactivo');
  $('deshacer').title = pasos.length ? `Deshacer: ${pasos[pasos.length - 1].texto}` : 'Nada que deshacer en este turno';
  $('terminar').textContent = miTurno ? 'Terminar turno' : p.fin ? 'Partida terminada' : eligiendo ? 'Elige en la ventana…' : p.turno ? `Juega ${NOMBRES[p.turno.i]}…` : 'Terminar turno';

  // Santuarios: un cuadrante por Guardián, en el orden de la cabecera
  $('santuarios').innerHTML = EL.map((s) => {
    const ns = p.pres[s].map((x) => x.n);
    const max = Math.max(...ns);
    const unico = max > 0 && ns.filter((x) => x === max).length === 1;
    const cuads = [0, 1, 2, 3].map((k) => {
      if (k >= p.n) return '<div class="cuad"></div>';
      const pr = p.pres[s][k];
      const puntos = Array.from({ length: pr.n }, (_, t) => `<i class="${t < pr.prot ? 'prot' : ''}" style="background:var(--${p.jug[k].color})"></i>`).join('');
      return `<div class="cuad ${pr.n === max && unico ? 'lider' : ''}"><div class="puntos">${puntos}</div></div>`;
    }).join('');
    const empate = max > 0 && !unico ? ' <span class="emp">· empate</span>' : '';
    return `<div class="sant cruz tx-${s}" style="--el:var(--${s})">${cuads}<div class="nucleo"><svg class="ico" style="color:var(--${s})"><use href="#${s}"/></svg></div><div class="marca">${NOMBRE_EL[s]}${empate}</div></div>`;
  }).join('');
  guia();
}

// ---------- Guía: qué hacer ahora ------------------------------------------------------------
let ayuda = true;
try { ayuda = localStorage.getItem('mana-ayuda') !== 'no'; } catch (e) { /* sin almacenamiento: ayuda encendida */ }
function ponerAyuda(si) {
  ayuda = si;
  try { localStorage.setItem('mana-ayuda', si ? 'si' : 'no'); } catch (e) { /* da igual */ }
}
const vistos = new Set(); // consejos que solo se dan una vez por partida

// Elige el mensaje según el momento del turno. Devuelve [texto, elemento al que apunta, lado del mensaje]
function pasoActual() {
  if (!p || p.fin || !p.turno || entreEras) return null;
  const yo = p.jug[0];
  if (p.turno.i !== 0 || ocupado) {
    if (vistos.has('rivales')) return null;
    return ['rivales', `Ahora juega <b>${NOMBRES[p.turno.i]}</b>. Arriba verás lo que hace cada rival; mira cómo cambian los <b>Santuarios</b>.`, $('santuarios').parentElement, 'izq'];
  }
  const usadas = yo.jugadas.length + p.turno.manaUsadas.length;
  const disp = p.manaDisponible();
  const masBarato = Math.min(...p.umbral.map((c) => p.coste(0, c)));
  const puedeComprar = !p.turno.vinculado && p.umbral.some((_, k) => p.puedeVincular(k));
  // Acabas de robar: señala la carta nueva
  if (nuevas.length) {
    const ultima = p.registro[p.registro.length - 1];
    const nombres = nuevas.map((c) => `<b>${c.nombre}</b>`).join(' y ');
    const destino = document.querySelector('#mano .carta.nueva') || $('mano');
    return ['robo' + p.registro.length, `Has robado ${nombres}. Ya está en tu mano, marcada como <b>NUEVA</b>: tócala para usarla este mismo turno.`, destino, 'abajo'];
  }
  if (p.registro.length && p.registro[p.registro.length - 1].sinCartas && p.registro[p.registro.length - 1].i === 0 && !vistos.has('sincartas' + p.registro.length)) {
    vistos.add('sincartas' + p.registro.length);
    return ['sincartas', 'Tu mazo y tu descarte estaban vacíos: no había cartas que robar.', $('mazo'), 'arriba'];
  }
  // Primera vez que juegas una Acción: explica los Santuarios
  if (yo.jugadas.length && !vistos.has('santuarios')) {
    return ['santuarios', 'Tu Acción ha puesto Presencias de <b>tu color</b> en un Santuario. Al final de cada Era, quien tenga <b>más</b> en cada Santuario gana sus Sellos. Las bolitas grandes marcan quién va primero.', $('santuarios').parentElement, 'izq', true];
  }
  // Liberar: se explica una vez cuando es posible
  const inicialUsada = [...p.turno.manaUsadas, ...yo.jugadas].some((c) => c.inicial);
  if (inicialUsada && p.puedeLiberar() && p.turno.vinculado && !vistos.has('liberar')) {
    return ['liberar', 'Truco: toca una <b>carta inicial</b> que ya hayas usado y pulsa <b>Liberar</b> (2 de Maná). Sale de la partida y tu mazo queda con cartas mejores.', $('mano'), 'abajo', true];
  }
  if (puedeComprar) {
    return ['vincular', `Tienes <b>${disp} de Maná</b>. Toca un Elemental del <b>Umbral</b> para vincularlo: irá a tu descarte y lo robarás en próximos turnos. Solo uno por turno.`, $('umbral').parentElement, 'der'];
  }
  if (!usadas && yo.mano.length) {
    return ['mano', 'Es tu turno. Toca una carta de tu mano: puedes jugar su <b>Acción</b> (la esfera de color) o usarla como <b>Maná</b> (la esfera lila) para vincular Elementales. Nunca las dos.', $('mano'), 'abajo'];
  }
  if (yo.mano.length && !p.turno.vinculado) {
    return ['mana', `Para vincular necesitas Maná: el Elemental más barato del Umbral cuesta <b>${masBarato}</b> y tienes <b>${disp}</b>. Usa más cartas como Maná o juega sus Acciones.`, $('total'), 'der'];
  }
  if (yo.mano.length) {
    return ['resto', 'Ya has vinculado. Puedes jugar las cartas que te quedan como <b>Acción</b>; las que no uses se descartan al terminar.', $('mano'), 'abajo'];
  }
  return ['terminar', 'Cuando acabes, pulsa <b>Terminar turno</b>. Descartas lo usado y robas 5 cartas nuevas. Después juegan los rivales.', $('terminar'), 'arriba'];
}

function guia() {
  const g = $('guia');
  const paso = ayuda && !$('velo').classList.contains('abierta') ? pasoActual() : null;
  if (!paso) { g.hidden = true; return; }
  const [clave, texto, destino, lado, unaVez] = paso;
  if (unaVez || clave === 'rivales') vistos.add(clave);
  const nuevo = g.dataset.clave !== clave;
  g.dataset.clave = clave;
  g.className = lado;
  g.innerHTML = `${texto}<span class="apagar" id="apagar-guia">No mostrar más ayudas</span>`;
  $('apagar-guia').onclick = () => { ponerAyuda(false); pintar(); };
  g.hidden = false;
  if (nuevo) { g.style.animation = 'none'; void g.offsetWidth; g.style.animation = ''; }
  // Coloca el mensaje junto a lo que señala (la página está ampliada con zoom: se divide)
  const z = parseFloat(document.body.style.zoom) || 1;
  const caja = document.body.getBoundingClientRect();
  const r = destino.getBoundingClientRect();
  const x = (r.left - caja.left) / z, y = (r.top - caja.top) / z, w = r.width / z, h = r.height / z;
  const gw = g.offsetWidth, gh = g.offsetHeight, m = 12;
  let left, top;
  if (lado === 'abajo') { left = x + w / 2 - gw / 2; top = y + h + m; }
  if (lado === 'arriba') { left = x + w / 2 - gw / 2; top = y - gh - m; }
  if (lado === 'der') { left = x + w + m; top = y + h / 2 - gh / 2; }
  if (lado === 'izq') { left = x - gw - m; top = y + h / 2 - gh / 2; }
  g.style.left = Math.max(8, Math.min(1280 - gw - 8, left)) + 'px';
  g.style.top = Math.max(8, Math.min(720 - gh - 8, top)) + 'px';
}

let pasos = []; // jugadas de este turno que se pueden deshacer (la última, arriba)
let revelado = false; // la jugada en curso ha mostrado cartas nuevas (no se podrá deshacer)
let eligiendo = false; // hay una elección abierta: hasta resolverla no se puede hacer otra cosa
function guardar(texto) {
  pasos.push({ estado: p.guardarEstado(), nuevas: nuevas.slice(), texto });
}
function deshacer() {
  if (!esMiTurno() || !pasos.length) return;
  const u = pasos.pop();
  p.restaurarEstado(u.estado);
  nuevas = u.nuevas;
  avisar(`Deshecho: ${u.texto}`, 2200);
  pintar();
}
const esMiTurno = () => p && !p.fin && !ocupado && !eligiendo && p.turno && p.turno.i === 0;

// ---------- Ventanas -------------------------------------------------------------------------
function abrir(html, botones = [], ancha = false, fija = false) {
  const v = $('ventana');
  if (fija) $('velo').dataset.fija = '1'; else delete $('velo').dataset.fija;
  v.className = 'ventana' + (ancha ? ' ancha' : '');
  v.innerHTML = html + (botones.length ? `<div class="botones">${botones.map((b, k) =>
    `<div class="boton ${b.clase || 'borde'} ${b.inactivo ? 'inactivo' : ''}" data-b="${k}">${b.texto}</div>`).join('')}</div>` : '');
  v.onclick = (e) => {
    const b = e.target.closest('[data-b]');
    if (!b) return;
    const def = botones[Number(b.dataset.b)];
    if (def.inactivo) return;
    if (def.cierra !== false) cerrar();
    if (def.accion) def.accion();
  };
  $('velo').classList.add('abierta');
  guia();
}
function cerrar() { $('velo').classList.remove('abierta'); guia(); }
$('velo').addEventListener('click', (e) => { if (e.target === $('velo') && !$('velo').dataset.fija) cerrar(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('velo').dataset.fija) cerrar(); });

const cabeceraCarta = (c, coste) => `${ilus(c)}<div class="nombre">${c.nombre}</div>${esferas(c, coste)}
  <div class="texto">${textoDe(c)}</div><div class="comomana">Como Maná da ${c.mana}</div>`;
const conObjetivos = (c) => c.accion.some((e) => e.remove || e.moveRival || e.moveOwnTo || e.protect || e.swap || e.disrupt || e.refresh || e.discard || e.handToTop || e.topFromDiscard || e.recover);

// Carta de la mano: Acción o Maná
function verCarta(donde, k) {
  const yo = p.jug[0];
  if (donde === 'mano') {
    const c = yo.mano[k];
    // Cartas sin Acción (Mota de Maná): no hay nada que elegir, se usan como Maná al tocarlas
    if (!c.accion.length && esMiTurno()) {
      guardar(`${c.nombre} como Maná`);
      nuevas = [];
      p.humanoMana(k);
      avisar(`${c.nombre}: +${c.mana} de Maná`, 1800);
      latido();
      pintar();
      return;
    }
    const roba = c.accion.some((e) => e.draw);
    const recupera = c.accion.some((e) => e.recover);
    let nota = '';
    if (roba) nota += '<div class="saldo">Si juegas su Acción, <b>robas solo</b> de tu mazo: la carta nueva aparece en tu mano, marcada como <b style="color:var(--verde)">NUEVA</b>, y puedes usarla este mismo turno.</div>';
    if (recupera) nota += '<div class="saldo">La carta recuperada vuelve de tu descarte a tu mano y puedes usarla este turno.</div>';
    if (conObjetivos(c)) nota += '<div class="nota">Al jugarla te preguntaré qué eliges en cada efecto.</div>';
    abrir(cabeceraCarta(c, c.coste) + nota, [
      { texto: 'Cancelar' },
      { texto: `Maná (+${c.mana})`, clase: 'borde', inactivo: !esMiTurno(), accion: () => { guardar(`${c.nombre} como Maná`); nuevas = []; p.humanoMana(k); latido(); pintar(); } },
      { texto: 'Acción', clase: 'lleno', inactivo: !esMiTurno() || !c.accion.length, accion: () => jugarAccion(k) },
    ]);
    return;
  }
  const c = donde === 'mana' ? p.turno.manaUsadas[k] : yo.jugadas[k];
  const botones = [{ texto: 'Cerrar' }];
  let saldo = donde === 'mana' ? 'Usada como Maná este turno.' : 'Jugada como Acción este turno.';
  if (donde === 'mana') {
    const puede = p.manaDisponible() >= c.mana;
    botones.push({ texto: 'Devolver a la mano', inactivo: !puede, accion: () => { guardar(`devolver ${c.nombre} a la mano`); nuevas = []; p.humanoDevolver(k); pintar(); } });
    if (!puede) saldo += ' Ya has gastado su Maná.';
  }
  if (c.inicial && p.v.liberar) {
    const puede = p.puedeLiberar();
    botones.push({ texto: `Liberar (${p.v.liberarCoste} Maná)`, clase: 'lleno', inactivo: !puede, accion: () => {
      guardar(`liberar ${c.nombre}`); p.humanoLiberar(donde, k); avisar(`Liberas ${c.nombre}: sale de la partida.`); latido(); pintar();
    } });
    saldo += puede ? ` Puedes liberarla: pagas ${p.v.liberarCoste} de Maná y sale de la partida.`
      : p.turno.liberado ? ' Ya has liberado una carta este turno.' : ` Para liberarla necesitas ${p.v.liberarCoste} de Maná disponible.`;
  }
  abrir(cabeceraCarta(c, c.coste) + `<div class="saldo">${saldo}</div>`, botones);
}

// Elemental del Umbral: vincular
function verUmbral(u) {
  const c = p.umbral[u];
  const coste = p.coste(0, c);
  const disp = esMiTurno() ? p.manaDisponible() : 0;
  const falta = coste - disp;
  const saldo = !esMiTurno() ? '<div class="saldo">Espera a tu turno para vincular.</div>'
    : p.turno.vinculado ? '<div class="saldo no">Ya has vinculado un Elemental este turno.</div>'
      : falta > 0 ? `<div class="saldo no">Cuesta ${coste} y tienes ${disp} de Maná: <b>te falta ${falta}</b>. Usa cartas de tu mano como Maná.</div>`
        : `<div class="saldo">Pagas <b>${coste}</b> de tus ${disp} de Maná. Irá a tu descarte.</div>`;
  abrir(cabeceraCarta(c, coste) + saldo, [
    { texto: 'Cancelar' },
    { texto: 'Vincular', clase: 'lleno', inactivo: !p.puedeVincular(u) || !esMiTurno(), accion: () => {
      guardar(`vincular ${c.nombre}`); nuevas = []; p.humanoVincular(u); avisar(`Vinculas ${c.nombre}: va a tu descarte.`); latido(); pintar();
    } },
  ]);
}

// ---------- Avisos y registro ----------------------------------------------------------------
function avisar(texto, ms = 2600) {
  const d = document.createElement('div');
  d.className = 'aviso';
  d.innerHTML = texto;
  $('avisos').appendChild(d);
  while ($('avisos').children.length > 3) $('avisos').firstChild.remove();
  setTimeout(() => d.remove(), ms);
}
function latido() {
  $('total').classList.add('latido');
  setTimeout(() => $('total').classList.remove('latido'), 160);
}
function describir(e) {
  const quien = NOMBRES[e.i];
  if (e.tipo === 'vincula') return e.i === 0 ? `Vinculas <b>${e.carta}</b>: va a tu descarte` : `${quien} vincula <b>${e.carta}</b>`;
  if (e.tipo === 'libera') return e.i === 0 ? `Liberas ${e.carta}: sale de la partida` : `${quien} libera ${e.carta}`;
  const partes = (e.cambios || []).map((x) => {
    const t = [];
    if (x.dn) t.push(`${x.dn > 0 ? '+' : '−'}${Math.abs(x.dn)} ${x.k === e.i ? '' : `de ${NOMBRES[x.k]} `}en ${NOMBRE_EL[x.s]}`);
    if (x.dp) t.push(`protege ${x.dp} en ${NOMBRE_EL[x.s]}`);
    return t.join(', ');
  });
  const yo = e.i === 0;
  const lista = (ns) => ns.length > 1 ? ns.slice(0, -1).join(', ') + ' y ' + ns[ns.length - 1] : ns[0];
  const robadas = e.robadas || [];
  // tus cartas se nombran; las de los rivales, solo se cuentan
  if (robadas.length) partes.push(yo ? `robas <b>${lista(robadas)}</b>` : `roba ${robadas.length}`);
  if (e.sinCartas) partes.push(yo ? 'no quedaban más cartas para robar' : 'no le quedaban cartas para robar');
  for (const n of e.notas || []) {
    if (n.tipo === 'descarta') partes.push(yo ? `descartas ${n.carta}` : 'descarta 1');
    if (n.tipo === 'encima') partes.push(yo ? `pones ${n.carta} encima de tu mazo (la robarás en tu próximo turno)` : 'pone 1 carta encima de su mazo');
    if (n.tipo === 'recupera') partes.push(yo ? `recuperas <b>${n.carta}</b> a tu mano` : 'recupera 1 carta');
  }
  return `${yo ? 'Juegas' : quien + ' juega'} <b>${e.carta}</b>${partes.length ? ': ' + partes.join(' · ') : ''}`;
}
function verRegistro() {
  const filas = p.registro.filter((e) => e.tipo !== 'fin').slice().reverse()
    .map((e) => `<div>Era ${ROMANO[e.era]} · ${describir(e)}</div>`).join('') || '<div>Todavía no ha pasado nada.</div>';
  // al acabar la partida, cerrar el registro vuelve al resultado final
  abrir(`<h2>Registro de la partida</h2><div class="lista-reg">${filas}</div>`, [
    { texto: 'Copiar registro', cierra: false, accion: copiarRegistro },
    { texto: 'Cerrar', clase: 'lleno', accion: () => { if (p.fin) finPartida(); } },
  ], true, p.fin);
}

// Texto completo de la partida, para pegarlo en un chat y analizarla
function textoRegistro() {
  const limpio = (h) => h.replace(/<[^>]+>/g, '');
  const L = [];
  L.push('MANA · registro de partida');
  L.push('Jugadores: ' + p.jug.map((j) => `${NOMBRES[j.i]} (${NOMBRE_EL[j.color]})`).join(', '));
  L.push('Sellos' + (p.fin ? ' finales' : ' por ahora') + ': ' + p.jug.map((j) => `${NOMBRES[j.i]} ${j.sellos} (por Era: ${j.selloEra.join(' / ') || '—'})`).join(' · '));
  if (p.fin) L.push('Ganador: ' + p.ganadores.map((k) => NOMBRES[k]).join(' y '));
  L.push('');
  L.push('Resumen por jugador:');
  for (const j of p.jug) {
    const mios = p.registro.filter((e) => e.i === j.i);
    const vinc = mios.filter((e) => e.tipo === 'vincula').map((e) => e.carta);
    const lib = mios.filter((e) => e.tipo === 'libera').map((e) => e.carta);
    let puestas = 0, quitadas = 0, acciones = 0, sobrante = 0;
    for (const e of mios) {
      if (e.tipo === 'accion') acciones++;
      if (e.tipo === 'fin') sobrante += e.manaSobrante || 0;
      for (const x of e.cambios || []) {
        if (x.k === j.i && x.dn > 0) puestas += x.dn;
        if (x.k !== j.i && x.dn < 0) quitadas -= x.dn;
      }
    }
    L.push(`- ${NOMBRES[j.i]}: ${acciones} Acciones, ${puestas} Presencias puestas, ${quitadas} Presencias rivales retiradas o movidas, ` +
      `${vinc.length} vinculados (${vinc.join(', ') || 'ninguno'}), ${lib.length} liberadas${j.i === 0 ? `, Maná sobrante al terminar turnos: ${sobrante}` : ''}`);
  }
  (p.historial || []).forEach((h, era) => {
    L.push('');
    L.push(`Puntuación de la Era ${ROMANO[era]}: ` + h.map((d) => `${NOMBRE_EL[d.s]} [${d.presencia.map((n, k) => NOMBRES[k] + ' ' + n).join(', ')}] → ` +
      (d.ganador !== null ? `${NOMBRES[d.ganador]} +${d.val}` : d.empate ? 'empate, nadie' : 'nadie')).join(' | '));
  });
  L.push('');
  L.push('Jugadas:');
  let clave = '';
  for (const e of p.registro) {
    const c = `Era ${ROMANO[e.era]}, ronda ${e.ronda + 1}`;
    if (c !== clave) { L.push(`— ${c}`); clave = c; }
    if (e.tipo === 'fin') {
      if (e.i === 0) L.push(`  Tú terminas: como Maná ${e.comoMana.join(', ') || 'nada'}; sin usar ${e.sinUsar.join(', ') || 'nada'}; Maná sobrante ${e.manaSobrante}`);
      continue;
    }
    L.push('  ' + limpio(describir(e)));
  }
  return L.join('\n');
}

function copiarRegistro() {
  const texto = textoRegistro();
  const respaldo = () => {
    abrir(`<h2>Registro para copiar</h2><textarea id="txt-reg" style="width:100%;height:320px;font:11px/1.4 monospace">${texto.replace(/</g, '&lt;')}</textarea>
      <div class="texto">Selecciona todo el texto y cópialo.</div>`, [{ texto: 'Cerrar', clase: 'lleno', accion: () => { if (p.fin) finPartida(); } }], true, p.fin);
    const t = $('txt-reg'); t.focus(); t.select();
  };
  try {
    navigator.clipboard.writeText(texto).then(() => avisar('Registro copiado: pégalo en el chat para analizar la partida', 3500), respaldo);
  } catch (e) { respaldo(); }
}

// ---------- Flujo de la partida --------------------------------------------------------------
// Juega una carta como Acción. Los efectos se aplican en orden; si uno pide elegir, se abre una ventana
async function jugarAccion(k) {
  const desde = p.registro.length;
  guardar(`jugar ${p.jug[0].mano[k].nombre}`);
  revelado = false;
  nuevas = [];
  eligiendo = true;
  const c = p.empezarAccion(0, k);
  pintar();
  for (let n = 0; n < c.accion.length; n++) {
    const e = c.accion[n];
    if (Partida.necesitaEleccion(e)) await resolver(c, e, n);
    else p.efecto(0, e, true);
    pintar();
  }
  p.terminarAccion(0);
  eligiendo = false;
  cerrar();
  // si has robado o se ha revelado un Elemental nuevo, ya no se puede volver atrás
  if (revelado || p.registro.slice(desde).some((e) => (e.robadas || []).length)) {
    pasos = [];
    avisar('Has visto cartas nuevas: lo jugado hasta ahora ya no se puede deshacer', 3200);
  }
  for (const e of p.registro.slice(desde)) {
    avisar(describir(e), 4200);
    nuevas.push(...(e.cartasRobadas || []));
    // una carta recuperada del descarte también llega nueva a la mano
    for (const x of e.notas || []) if (x.tipo === 'recupera') nuevas.push(p.jug[0].mano.find((m) => m.nombre === x.carta));
  }
  pintar();
}

// Abre una ventana con opciones y espera la elección. opciones: [{ html, valor }]. Devuelve el valor o null (saltar)
function elegir(c, n, titulo, texto, opciones, saltar) {
  return new Promise((ok) => {
    const total = c.accion.length;
    const paso = total > 1 ? `<div class="paso">${c.nombre} · efecto ${n + 1} de ${total}</div>` : `<div class="paso">${c.nombre}</div>`;
    const botones = saltar ? [{ texto: saltar, accion: () => ok(null) }] : [];
    abrir(`${paso}<h2>${titulo}</h2><div class="texto">${texto}</div>
      <div class="elecciones">${opciones.map((o, k) => `<div class="eleccion" tabindex="0" data-o="${k}">${o.html}</div>`).join('')}</div>`, botones, false, true);
    const lista = $('ventana').querySelector('.elecciones');
    const tomar = (el) => { if (el) { cerrar(); ok(opciones[Number(el.dataset.o)].valor); } };
    lista.onclick = (e) => tomar(e.target.closest('.eleccion'));
    lista.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tomar(e.target.closest('.eleccion')); } };
  });
}

const chip = (color, icono) => `<span class="chip" style="background:var(--${color})">${icono ? `<svg><use href="#${icono}"/></svg>` : ''}</span>`;
const rival = (k) => `<span style="color:var(--${p.jug[k].color})">${NOMBRES[k]}</span>`;
const presTexto = (s) => p.pres[s].map((x, k) => `${NOMBRES[k]} ${x.n}`).join(' · ');
const rivalesCon = (s) => p.jug.filter((j) => j.i !== 0 && p.quitables(s, j.i) > 0).map((j) => j.i);
const cartaOpcion = (m, extra = '') => `${chip(m.el || 'mana', m.el || '')}<div><b>${m.nombre}</b><small>${textoDe(m) || 'Solo da Maná.'}${extra}</small></div>`;

// Resuelve un efecto que pide elegir
async function resolver(c, e, n) {
  const sants = e.s === '*' ? EL : [e.s];

  if (e.remove) {
    let donde = null;
    for (let t = 0; t < e.remove; t++) {
      const ops = [];
      for (const s of donde ? [donde] : sants) for (const k of rivalesCon(s)) {
        ops.push({ valor: [s, k], html: `${chip(s, s)}<div><b>${NOMBRE_EL[s]}: quitar 1 a ${rival(k)}</b><small>${presTexto(s)}</small></div>` });
      }
      if (!ops.length) { if (t === 0) avisar(`${c.nombre}: no hay Presencias rivales que se puedan retirar`); break; }
      const titulo = e.remove > 1 ? `Retira hasta ${e.remove} Presencias rivales${t ? ` (${t + 1}.ª)` : ''}` : 'Retira 1 Presencia rival';
      const texto = e.remove > 1 ? 'Todas del mismo Santuario. Las protegidas no se pueden retirar.' : 'De cualquier Santuario. Las protegidas no se pueden retirar.';
      const v = await elegir(c, n, titulo, texto, ops, e.remove > 1 ? (t ? 'No retirar más' : 'No retirar') : null);
      if (!v) break;
      p.elegirRetirar(v[0], v[1]);
      donde = v[0];
      pintar();
    }
    return;
  }

  if (e.swap) {
    const ops = rivalesCon(e.s).map((k) => ({ valor: k, html: `${chip(e.s, e.s)}<div><b>Quitar 1 a ${rival(k)} y poner 1 tuya</b><small>${NOMBRE_EL[e.s]}: ${presTexto(e.s)}</small></div>` }));
    if (!ops.length) { avisar(`${c.nombre}: ningún rival tiene Presencia que retirar en ${NOMBRE_EL[e.s]}`); return; }
    const k = await elegir(c, n, `Cambia una Presencia en ${NOMBRE_EL[e.s]}`, 'Retiras 1 Presencia rival y pones 1 tuya en su lugar.', ops, null);
    p.elegirIntercambio(0, e.s, k);
    return;
  }

  if (e.moveRival) {
    for (let t = 0; t < e.moveRival; t++) {
      const ops = [];
      for (const s of sants) for (const k of rivalesCon(s)) ops.push({ valor: [s, k], html: `${chip(s, s)}<div><b>Mover 1 de ${rival(k)} desde ${NOMBRE_EL[s]}</b><small>${presTexto(s)}</small></div>` });
      if (!ops.length) { if (t === 0) avisar(`${c.nombre}: no hay Presencias rivales que se puedan mover`); break; }
      const v = await elegir(c, n, `Mueve una Presencia rival${e.moveRival > 1 ? ` (${t + 1} de ${e.moveRival})` : ''}`, 'Primero eliges cuál; después, a qué Santuario va.', ops, 'No mover');
      if (!v) break;
      const [o, k] = v;
      const destinos = EL.filter((d) => d !== o).map((d) => ({ valor: d, html: `${chip(d, d)}<div><b>Llevarla a ${NOMBRE_EL[d]}</b><small>${presTexto(d)}</small></div>` }));
      const d = await elegir(c, n, `¿A dónde va la Presencia de ${NOMBRES[k]}?`, `Sale de ${NOMBRE_EL[o]}.`, destinos, null);
      p.elegirMover(o, k, d);
      pintar();
    }
    return;
  }

  if (e.moveOwnTo) {
    const dest = e.moveOwnTo;
    const ops = EL.filter((s) => s !== dest && p.quitables(s, 0) > 0)
      .map((s) => ({ valor: s, html: `${chip(s, s)}<div><b>Mover 1 tuya de ${NOMBRE_EL[s]} a ${NOMBRE_EL[dest]}</b><small>${presTexto(s)}</small></div>` }));
    if (!ops.length) { avisar(`${c.nombre}: no tienes Presencias que mover`); return; }
    const o = await elegir(c, n, `Mueve 1 Presencia tuya a ${NOMBRE_EL[dest]}`, 'Elige de dónde sale. Puedes no moverla.', ops, 'No mover');
    if (o) p.elegirMover(o, 0, dest);
    return;
  }

  if (e.protect) {
    const veces = e.all ? 1 : e.protect;
    for (let t = 0; t < veces; t++) {
      const ops = EL.filter((s) => p.pres[s][0].n > p.pres[s][0].prot).map((s) => {
        const x = p.pres[s][0];
        const cuantas = e.all ? `todas (${x.n - x.prot})` : '1';
        return { valor: s, html: `${chip(s, 'escudo')}<div><b>Proteger ${cuantas} en ${NOMBRE_EL[s]}</b><small>Tienes ${x.n}, protegidas ${x.prot}</small></div>` };
      });
      if (!ops.length) { if (t === 0) avisar(`${c.nombre}: no tienes Presencias sin proteger`); break; }
      const titulo = e.all ? 'Protege todas tus Presencias de un Santuario' : `Protege una Presencia tuya (${t + 1} de ${veces})`;
      const s = await elegir(c, n, titulo, 'Hasta el final de la Era no se podrán retirar ni mover.', ops, null);
      p.elegirProteger(0, s, !!e.all);
      pintar();
    }
    return;
  }

  const yo = p.jug[0];
  if (e.discard || e.handToTop) {
    if (!yo.mano.length) return;
    const ops = yo.mano.map((m, k) => ({ valor: k, html: cartaOpcion(m) }));
    const k = e.discard
      ? await elegir(c, n, 'Descarta 1 carta de tu mano', 'Va a tu descarte.', ops, null)
      : await elegir(c, n, 'Pon 1 carta de tu mano encima de tu mazo', 'La robarás en tu próximo turno.', ops, null);
    if (e.discard) p.elegirDescartar(0, k); else p.elegirManoEncima(0, k);
    return;
  }

  if (e.topFromDiscard || e.recover) {
    if (!yo.desc.length) { avisar(`${c.nombre}: tu descarte está vacío`); return; }
    // una opción por carta distinta
    const vistas = new Set();
    const ops = [];
    yo.desc.forEach((m, k) => { if (!vistas.has(m.nombre)) { vistas.add(m.nombre); ops.push({ valor: k, html: cartaOpcion(m) }); } });
    if (e.recover) {
      const k = await elegir(c, n, 'Recupera 1 carta de tu descarte', 'Vuelve a tu mano y puedes usarla este turno.', ops, null);
      p.elegirRecuperar(0, k);
    } else {
      const k = await elegir(c, n, 'Pon 1 carta de tu descarte encima de tu mazo', 'La robarás en tu próximo turno.', ops, null);
      p.elegirDescarteEncima(0, k);
    }
    return;
  }

  if (e.refresh) {
    const ops = p.umbral.map((m, u) => ({ valor: u, html: cartaOpcion(m, ` · Coste ${p.coste(0, m)}`) }));
    const u = await elegir(c, n, 'Cambia 1 Elemental del Umbral', 'Se descarta y se revela otro en su lugar (puedes vincularlo este turno).', ops, 'No cambiar');
    if (u !== null) {
      revelado = true;
      const fuera = p.elegirCambioUmbral(u);
      avisar(`${fuera.nombre} sale del Umbral; entra ${p.umbral[p.umbral.length - 1].nombre}`);
    }
  }
}

function nuevaPartida(n) {
  p = new Partida(n, { seed: Math.floor(Math.random() * 1e9), registro: true }).iniciar();
  vistos.clear();
  ocupado = false;
  avanzar();
  const yo = p.jug[0];
  abrir(`<h2>Eres el Guardián ${yo.color === 'agua' ? 'del Agua' : yo.color === 'aire' ? 'del Aire' : yo.color === 'tierra' ? 'de la Tierra' : 'del Fuego'}</h2>
    <svg style="width:56px;height:56px;color:var(--${yo.color})"><use href="#${yo.color}"/></svg>
    <div class="texto">Tus Presencias son de tu color. Tu mazo lleva un Elemental menor más de tu elemento.</div>
    <div class="texto"><b>Cada turno:</b> toca tus cartas para usarlas como <b>Acción</b> o como <b>Maná</b>, toca un Elemental del <b>Umbral</b> para vincularlo y pulsa <b>Terminar turno</b>.</div>
    <div class="texto">Al final de cada Era, quien tenga más Presencia en cada Santuario gana sus Sellos (1, 2 y 3). Empate en cabeza: nadie.</div>
    <div class="texto">¿Te has equivocado? Pulsa <b>Deshacer</b>, junto a «Terminar turno», para volver atrás dentro de tu turno (salvo después de robar cartas).</div>
    <div class="texto" style="color:var(--mana)">Te iré guiando con mensajes lilas. Puedes apagarlos arriba, en «Ayuda».</div>`,
  [{ texto: '¡A jugar!', clase: 'verde' }]);
}

// Avanza hasta que le toca a la persona o acaba la partida
function avanzar() {
  if (p.fin) { pintar(); return finPartida(); }
  const i = p.comenzarTurno();
  pasos = [];
  pintar();
  if (i === 0) return;
  ocupado = true;
  pintar();
  setTimeout(() => {
    const desde = p.registro.length;
    p.turnoBot(i);
    const hechos = p.registro.slice(desde).filter((e) => e.tipo !== 'fin');
    if (!hechos.length) avisar(`${NOMBRES[i]} no juega Acciones ni vincula`);
    hechos.forEach((e, k) => setTimeout(() => avisar(describir(e), 2200), k * 450 * VEL));
    pintar();
    setTimeout(() => { ocupado = false; cerrarTurno(); }, (700 + hechos.length * 450) * VEL);
  }, 650 * VEL);
}

function cerrarTurno() {
  const antes = p.jug[0].selloEra.length;
  p.terminarTurno();
  if (p.jug[0].selloEra.length > antes) return finEra();
  avanzar();
}

$('terminar').onclick = () => {
  if (!esMiTurno()) return;
  nuevas = [];
  pasos = [];
  const antes = p.jug[0].selloEra.length;
  p.humanoTerminar();
  if (p.jug[0].selloEra.length > antes) return finEra();
  avanzar();
};

$('deshacer').onclick = deshacer;
$('mazo').parentElement.onclick = () => {
  if (!p || !p.turno) return;
  const yo = p.jug[0];
  abrir(`<h2>Tu mazo</h2><div class="dorso" style="margin:4px auto">${yo.mazo.length}</div>
    <div class="texto">Son tus cartas boca abajo. <b>No se roba tocándolo:</b> robas 5 automáticamente al terminar tu turno, y más cuando juegas una carta que dice <b>Roba</b>.</div>
    <div class="texto">Cuando se acaba, tu descarte se baraja y forma un mazo nuevo. Así vuelven los Elementales que vinculas.</div>`, [{ texto: 'Entendido', clase: 'lleno' }]);
};
$('descarte').parentElement.onclick = () => {
  if (!p || !p.turno) return;
  const yo = p.jug[0];
  const cuenta = {};
  for (const c of yo.desc) cuenta[c.nombre] = (cuenta[c.nombre] || 0) + 1;
  const lista = Object.entries(cuenta).map(([n, k]) => `${n}${k > 1 ? ' ×' + k : ''}`).join(', ') || 'Está vacío.';
  abrir(`<h2>Tu descarte</h2><div class="texto">${lista}</div>
    <div class="texto">Aquí van las cartas que usas y los Elementales que vinculas. Cuando tu mazo se acaba, se barajan y vuelven a él.</div>`, [{ texto: 'Entendido', clase: 'lleno' }]);
};
$('umbral').addEventListener('click', (e) => { const f = e.target.closest('.fila-u'); if (f && p) verUmbral(Number(f.dataset.u)); });
$('mano').addEventListener('click', (e) => { const f = e.target.closest('.carta'); if (f && p) verCarta(f.dataset.donde, Number(f.dataset.k)); });

function tablaPuntuacion() {
  return `<table class="tabla">${p.ultimaPuntuacion.map((d) => {
    const quien = d.ganador !== null ? `<span style="color:var(--${p.jug[d.ganador].color});font-weight:700">${NOMBRES[d.ganador]}</span>`
      : d.empate ? 'Empate: nadie' : 'Nadie tiene Presencia';
    const pres = d.presencia.map((n, k) => `${NOMBRES[k]} ${n}`).join(' · ');
    return `<tr><td><b style="color:var(--${d.s})">${NOMBRE_EL[d.s]}</b><br><small style="color:var(--suave)">${pres}</small></td><td>${quien}</td><td>${d.ganador !== null ? '+' + d.val : '—'}</td></tr>`;
  }).join('')}</table>`;
}
const clasificacion = () => p.jug.slice().sort((a, b) => b.sellos - a.sellos)
  .map((j) => `<span style="color:var(--${j.color});font-weight:700">${NOMBRES[j.i]} ${j.sellos}</span>`).join(' · ');

function finEra() {
  entreEras = true;
  pintar();
  const era = p.fin ? 2 : p.era - 1;
  if (p.fin) return finPartida();
  abrir(`<h2>Fin de la Era ${ROMANO[era]}</h2>${tablaPuntuacion()}<div class="texto">Sellos: ${clasificacion()}</div>
    <div class="texto">Los Santuarios se vacían. Tu mazo se queda contigo. Empieza la Era ${ROMANO[p.era]} quien va primero.</div>`,
  [{ texto: `Empezar la Era ${ROMANO[p.era]}`, clase: 'verde', accion: () => { entreEras = false; avanzar(); } }], true, true);
}

function finPartida() {
  const gana = p.ganadores.map((k) => NOMBRES[k]);
  const titulo = p.ganadores.length > 1 ? `Victoria compartida: ${gana.join(' y ')}` : p.ganadores[0] === 0 ? '¡Has ganado!' : `Gana ${gana[0]}`;
  abrir(`<h2>${titulo}</h2>${tablaPuntuacion()}<div class="texto">Sellos finales: ${clasificacion()}</div>`,
    [{ texto: 'Ver registro', accion: verRegistro }, { texto: 'Copiar registro', cierra: false, accion: copiarRegistro }, { texto: 'Otra partida', clase: 'verde', accion: inicio }], true, true);
}

function inicio() {
  let n = 4;
  const pintarOpciones = () => [2, 3, 4].map((k) => `<div class="opcion ${k === n ? 'elegida' : ''}" data-n="${k}">${k - 1} ${k === 2 ? 'rival' : 'rivales'}</div>`).join('');
  abrir(`<h2 style="letter-spacing:.3em">MANA</h2><div class="texto">Guardianes, Elementales y cuatro Santuarios.<br>3 Eras. Gana quien reúna más Sellos.</div>
    <div class="opciones" id="opciones">${pintarOpciones()}</div>`,
  [{ texto: 'Empezar', clase: 'verde', accion: () => nuevaPartida(n) }], false, true);
  $('opciones').onclick = (e) => { const o = e.target.closest('[data-n]'); if (o) { n = Number(o.dataset.n); $('opciones').innerHTML = pintarOpciones(); } };
}

// Mesa vacía de fondo mientras se elige
p = new Partida(4, { seed: 1, registro: true }).iniciar();
p.turno = null;
window.guiaLista = true;
pintar();
inicio();
</script>
