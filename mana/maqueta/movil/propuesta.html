<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:G;src:url(../../web/texturas/grandstander.woff2) format('woff2');font-weight:400 700}
:root{--tinta:#1d1d1f;--suave:#8a8a8f;--mana:#a78bfa;--fuego:#d36754;--agua:#5f8fc9;--tierra:#7f9a62;--aire:#e2b53c}
*{box-sizing:border-box;margin:0}
body{background:#ddd;font:600 12px/1.25 G,sans-serif;text-transform:uppercase;display:flex;gap:40px;padding:30px;align-items:flex-start}
.tel{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:#faf6f0 url(../../web/texturas/fondo.webp) center/cover;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:50px 16px 24px;gap:12px}
.cap{position:absolute;top:-26px;left:0;font:700 14px G;color:#555}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top img{height:30px}
.yo{display:flex;align-items:center;gap:5px;font-weight:700}
.reg{justify-self:end;font-size:10px;color:#fff;padding:6px 11px 4px;border-radius:12px;background:#cfc0f6;box-shadow:inset 2px 3px 5px rgba(60,35,10,.3),inset -2px -2px 4px rgba(255,255,255,.55)}
.sp{width:22px;height:22px;background:center/contain no-repeat;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;padding-top:2px}
.f{background-image:url(../../web/texturas/esfera-fuego.webp)}.a{background-image:url(../../web/texturas/esfera-agua.webp)}.t{background-image:url(../../web/texturas/esfera-tierra.webp)}.i{background-image:url(../../web/texturas/esfera-aire.webp)}
.riv{display:flex;justify-content:space-between;color:var(--suave);font-size:11px}.riv span{display:flex;align-items:center;gap:4px}
.era{display:flex;justify-content:center;gap:14px;color:var(--suave);font-size:10px;margin-top:-4px}
.tit{height:18px;display:flex;justify-content:center}.tit img{height:18px}
.sants{display:grid;grid-template-columns:repeat(4,1fr);border-radius:4px;overflow:hidden;height:84px}
.sa{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;border-left:1px solid rgba(255,255,255,.7)}
.sa:first-child{border:0}
.sa i{display:block;width:11px;height:11px;background-position:center;background-size:contain;background-repeat:no-repeat}
.row{display:flex;gap:1px}
.umb{display:flex;gap:8px;overflow:hidden;padding:4px 2px}
.uc{flex:none;width:66px;text-align:center;font-size:9px;color:#6b5a43;background:rgba(240,228,210,.6);border-radius:12px;padding:5px 0 6px}
.uc img{width:56px;height:56px;object-fit:contain}
.uc.cara{opacity:.45}
.es{display:flex;gap:2px;justify-content:center;margin-top:3px}
.e{width:17px;height:17px;border-radius:50%;color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;padding-top:1px}
.c{background:#a3a3a8}.m{background:var(--mana)}
.mano{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:2px}
.ca{text-align:center;font-size:9px}
.ca img{width:100%;height:78px;object-fit:contain}
.ca .es .e{width:22px;height:22px;font-size:10px}
.ca.sel{transform:translateY(-6px)}
.pilas{display:flex;justify-content:center;gap:26px;margin-top:auto}
.pi{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--suave);font-size:10px}
.bo{width:62px;height:62px;background:center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;padding-top:4px;opacity:.85}
.gris{background-image:url(../../web/texturas/esfera-gris.webp)}.lila{background-image:url(../../web/texturas/esfera-mana.webp)}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{text-align:center;padding:14px 0 11px;border-radius:22px;font-weight:700;font-size:13px;color:#6b5a43;background:#efe6da url(../../web/texturas/fondo.webp) center/cover;background-blend-mode:multiply;box-shadow:inset 2px 3px 6px rgba(60,35,10,.32),inset -2px -2px 5px rgba(255,255,255,.6),0 1px 0 rgba(255,255,255,.8)}
.b.v{background-color:#9cc7a5;color:#fff}
.guia{position:absolute;left:16px;right:16px;bottom:96px;background:var(--mana);color:#fff;border-radius:14px;padding:10px 12px;font-size:11px;text-transform:none}
.nota{position:absolute;right:-250px;width:230px;font:500 13px/1.4 G;text-transform:none;color:#333}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.velo{position:absolute;inset:0;background:rgba(29,29,31,.35)}
.hoja img{height:110px}
.hoja .texto{color:var(--suave);font-size:11px;text-transform:none;text-align:center}
</style></head><body>
<div class="tel"><div class="cap">A · Tu turno</div>
  <div class="top"><div class="yo">Pol <span class="sp f">0</span></div><img src="../../web/texturas/titulo.webp"><div class="reg">Reglas</div></div>
  <div class="riv"><span>Ana <i class="sp a">0</i></span><span>Marc <i class="sp t">0</i></span><span>Lía <i class="sp i">0</i></span></div>
  <div class="era"><span>Era I</span><span>Ronda 1/5</span></div>
  <div class="tit"><img src="../../web/texturas/titulo-santuarios.webp"></div>
  <div class="sants" id="sants"></div>
  <div class="tit"><img src="../../web/texturas/titulo-umbral.webp"></div>
  <div class="umb" id="umb"></div>
  <div class="tit"><img src="../../web/texturas/titulo-ofrenda.webp"></div>
  <div class="mano" id="mano"></div>
  <div class="pilas"><div class="pi"><div class="bo gris">5</div>Fuente</div><div class="pi" style="color:var(--mana)"><div class="bo lila">2</div>Maná</div><div class="pi"><div class="bo gris">0</div>Reserva</div></div>
  <div class="bts"><div class="b">Deshacer</div><div class="b v">Terminar turno</div></div>
</div>
<div class="tel"><div class="cap">B · Tocar una carta</div>
  <div class="top"><div class="yo">Pol <span class="sp f">0</span></div><img src="../../web/texturas/titulo.webp"><div class="reg">Reglas</div></div>
  <div class="riv"><span>Ana <i class="sp a">0</i></span><span>Marc <i class="sp t">0</i></span><span>Lía <i class="sp i">0</i></span></div>
  <div class="era"><span>Era I</span><span>Ronda 1/5</span></div>
  <div class="tit"><img src="../../web/texturas/titulo-santuarios.webp"></div>
  <div class="sants" id="sants2"></div>
  <div class="velo"></div>
  <div class="hoja"><img src="../../web/elementales/Ígneo.webp"><b style="font-size:16px">Ígneo</b>
   <div class="es"><span class="e c" style="width:30px;height:30px;font-size:12px">4</span><span class="e m" style="width:30px;height:30px;font-size:12px">2</span><span class="e" style="width:30px;height:30px;font-size:11px;background:linear-gradient(90deg,var(--fuego) 50%,#4b5563 50%)">+1 −1</span></div>
   <div class="texto">+1 en Fuego y retira 1 Presencia rival de cualquier Santuario.</div>
   <div class="bts" style="width:100%;grid-template-columns:1fr 1fr 1fr"><div class="b">Cancelar</div><div class="b" style="background-color:#cfc0f6;color:#fff">Maná (+2)</div><div class="b v">Acción</div></div></div>
</div>
<script>
const E=['fuego','agua','tierra','aire'], col={fuego:'f',agua:'a',tierra:'t',aire:'i'}, tint={fuego:'rgba(211,103,84,.28)',agua:'rgba(95,143,201,.28)',tierra:'rgba(110,165,85,.32)',aire:'rgba(226,181,60,.3)'};
const pres=[[1,6,4,2],[4,2,7,5],[7,5,3,1],[3,1,6,4]], jc=['f','a','t','i'];
for (const id of ['sants','sants2']) document.getElementById(id).innerHTML=E.map((s,k)=>`<div class="sa" style="background:${tint[s]}">${pres[k].map((n,j)=>`<div class="row">${Array.from({length:n},()=>`<i class="${jc[j]}"></i>`).join('')}</div>`).join('')}</div>`).join('');
const U=[['Gota',2,1,'agua','+1'],['Ígneo',4,2,'fuego','+1·−1'],['Pedregal',3,1,'neutro','⛨2'],['Remolino',3,1,'neutro','↺'],['Coloso',0]];
const umb=[['Gota',2,1,'agua','+1',0],['Ígneo',4,2,'fuego','+1',1],['Pedregal',3,1,'#4b5563','2',1],['Velo',3,1,'aire','+1',0],['Magma',5,2,'fuego','+1',1]];
document.getElementById('umb').innerHTML=umb.map(([n,c,m,el,a,cara])=>`<div class="uc ${cara?'cara':''}"><img src="../../web/elementales/${n}.webp">${n}<div class="es"><span class="e c">${c}</span><span class="e m">${m}</span><span class="e" style="background:${el.startsWith('#')?el:'var(--'+el+')'}">${a}</span></div></div>`).join('');
const mano=[['Volcán','fuego','+2',1],['Gota','agua','+1',0],['Mota',null,null,0],['Polvo','tierra','+1',0],['Brisa','aire','+1',0]];
document.getElementById('mano').innerHTML=mano.map(([n,el,a])=>`<div class="ca"><img src="../../web/elementales/${n}.webp">${n}<div class="es"><span class="e m">1</span>${el?`<span class="e" style="background:var(--${el})">${a}</span>`:''}</div></div>`).join('');
</script></body></html>
