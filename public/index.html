<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HÉROES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/dados/rojo.webp">
</head>
<body>
  <header class="topbar">
    <div class="brand">Héroes</div>
    <div id="status" class="status"></div>
    <button id="rulesBtn" class="rules-btn">Reglas</button>
    <button id="soundBtn" class="sound-btn" title="Silenciar sonidos" aria-label="Silenciar sonidos"></button>
    <span id="roomInfo" class="room-code"></span>
  </header>

  <main id="home" class="home hidden">
    <div class="home-sheet">
      <img class="home-title" src="img/logo-tinta.webp" alt="Héroes">
      <p class="home-credit">Aventura y torneo para cuatro héroes</p>
      <button id="playBtn" class="seal home-play">Jugar</button>
    </div>
  </main>

  <div id="homeModal" class="modal hidden">
    <div class="card home-modal">
      <button class="modal-close" id="homeClose" aria-label="Cerrar" title="Cerrar">×</button>
      <input id="nameInput" class="ink-input name-input" maxlength="20" placeholder="Tu nombre" aria-label="Tu nombre">
      <div id="homeActions" class="home-actions"></div>
      <p id="homeError" class="error center"></p>
    </div>
  </div>

  <main id="app" class="screen hidden">
    <div id="lobby" class="hidden"></div>
    <div id="table" class="table3 hidden">
      <aside id="sheet" class="col-me card"></aside>
      <section id="main" class="col-stage"></section>
      <aside id="arena" class="col-rivals card"></aside>
    </div>
  </main>

  <button id="journalBtn" class="journal-btn hidden" title="Crónica y chat">📜</button>
  <aside id="journal" class="journal hidden">
    <div class="journal-head"><h3>Crónica</h3><button class="btn tiny" id="journalClose">✕</button></div>
    <div id="log" class="log"></div>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="row">
      <input id="chatInput" maxlength="200" placeholder="Escribe al grupo…" autocomplete="off">
      <button class="btn small">Enviar</button>
    </form>
  </aside>

  <div id="reveal" class="reveal hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
