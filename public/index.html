<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HÉROES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/dados/rojo.webp">
</head>
<body>
  <header class="topbar">
    <div class="brand">Héroes</div>
    <div id="status" class="status"></div>
    <div id="roomInfo" class="room-info"></div>
  </header>

  <main id="home" class="screen hidden">
    <section class="card home-card">
      <img class="home-logo" src="img/logo.webp" alt="HÉROES">
      <div class="home-art">
        <img src="img/heroes/humano-guerrero.webp" alt="">
        <img src="img/heroes/elfo-guerrero.webp" alt="">
        <img src="img/heroes/gnomo-mago.webp" alt="">
        <img src="img/heroes/enano-guerrero.webp" alt="">
        <img src="img/heroes/durgan-barbaro.webp" alt="">
        <img src="img/heroes/faunar-explorador.webp" alt="">
        <img src="img/heroes/silvano-druida.webp" alt="">
      </div>
      <p class="sub">Aventura y torneo para 4 héroes. Juega con tus amigos por internet.</p>
      <label>Tu nombre
        <input id="nameInput" maxlength="20" placeholder="Nombre del jugador">
      </label>
      <button id="createBtn" class="btn primary">Crear partida nueva</button>
      <div class="or">o únete con un código</div>
      <div class="row">
        <input id="codeInput" maxlength="4" placeholder="CÓDIGO" class="code-input">
        <button id="joinBtn" class="btn">Unirse</button>
      </div>
      <p id="homeError" class="error"></p>
    </section>
  </main>

  <main id="app" class="screen hidden">
    <div id="lobby" class="hidden"></div>
    <div id="table" class="hidden">
      <section id="arena" class="arena"></section>
      <div class="board">
        <section id="main" class="stage"></section>
        <aside id="sheet" class="me"></aside>
      </div>
    </div>
  </main>

  <button id="journalBtn" class="journal-btn hidden" title="Crónica y chat">📜</button>
  <aside id="journal" class="journal hidden">
    <div class="journal-head"><h3>Crónica</h3><button class="btn tiny" id="journalClose">✕</button></div>
    <div id="log" class="log"></div>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="row">
      <input id="chatInput" maxlength="200" placeholder="Escribe al grupo…" autocomplete="off">
      <button class="btn small">Enviar</button>
    </form>
  </aside>

  <div id="reveal" class="reveal hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
